{% include 'header.html' %}

<div style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: Arial, sans-serif;">

    <h1 style="text-align: center; font-size: 2em; color: #333; margin-bottom: 30px;">Product Management</h1>

    {% for product in products %}
    <div style="border: 1px solid #ddd; border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); background-color: #fafafa;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <h4 style="margin: 0 0 5px 0; font-size: 1.3em; font-weight: bold; color: #2c3e50;">{{ product.title }}</h4>
                <span style="display: inline-block; background-color: #27ae60; color: white; padding: 4px 10px; border-radius: 5px; font-size: 0.95em;">
                    ₹{{ product.price }}
                </span>
            </div>
            <a href="{{ url_for('delete', id=product.id) }}"
               style="padding: 6px 14px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; text-decoration: none; font-size: 0.9em; cursor: pointer; height: fit-content;">
                Delete
            </a>
        </div>
        <p style="margin-top: 12px; color: #555;">{{ product.product_info }}</p>
    </div>
    {% endfor %}

    <div style="text-align: center; margin-top: 30px;">
        <a href="{{ url_for('logout') }}"
           style="padding: 10px 20px; background-color: #2c3e50; color: white; border-radius: 6px; text-decoration: none; font-weight: bold;">
            Logout
        </a>
    </div>
</div>

{% include 'footer.html' %}
